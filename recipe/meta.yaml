{% set name = "sunpy" %}
{% set version = "8.0.0rc2" %}
{% set sha256 = "390d639d69be062eef042cb25b7c6338e8311215eb8fd73c59b8a1b9b9b51cb8" %}
{% set py_str = (py | string)[0] ~ "." ~ (py | string)[1:] %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  python_version_independent: true  # [is_abi3]
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  skip: true  # [is_abi3 and py != 312]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}  # [not win]
    - {{ stdlib("c") }}    # [not win]
  host:
    - python-abi3  # [is_abi3]
    - python
    - pip
    - setuptools
    - setuptools_scm
    - extension-helpers
    - numpy
  run:
    - python
    - sqlite !=3.49.0,!=3.49.1  # https://github.com/conda-forge/sqlite-feedstock/issues/130
    # base
    - astropy-base >=7.0.0
    - fsspec >=2023.6.0
    - numpy >=1.26.0
    - packaging >=24.1
    - parfive >=2.2.0
    - pyerfa >=2.0.1.1
    - requests >=2.33.0
    # asdf
    - asdf >=3.3.0
    - asdf-astropy >=0.7.0
    # image
    - scipy >=1.14.0
    # jpeg2000
    - glymur >=0.14.0
    - lxml >=5.3.0
    # map
    - contourpy >=1.3.0
    - matplotlib-base >=3.10.0
    - mpl_animators >=1.2.0
    - reproject >=0.14.0
    # net
    - beautifulsoup4 >=4.13.1
    - drms >=0.8.0
    - python-dateutil >=2.9.0
    - tqdm >=4.7.0
    - zeep >=4.3.0
    # spice
    - spiceypy >=7.0.0  # [not ppc64le]
    # timeseries
    - cdflib >=1.3.2
    - h5netcdf >=1.4.0
    - h5py >=3.12.0 # Not a direct dependancy, but goes files wont load without
    - pandas >=2.3.0

test:
  requires:
    - aiobotocore
    - hvpy
    - hypothesis
    - jplephem
    - scikit-image
    - libopencv * headless*               # [unix]
    - opencv
    - pytest-astropy
    - pytest-mock
    - pytest-mpl
    - pytest-asdf-plugin
    - abi3audit                      # [is_abi3]
    - responses
    - pytest-run-parallel

  commands:
    - pip check
    - abi3audit $SP_DIR/sunpy/io/_pyana.abi3.so $SP_DIR/sunpy/compiler_version.abi3.so -s -v --assume-minimum-abi3 {{ py_str }}   # [unix and is_abi3]


about:
  home: https://www.sunpy.org/
  license: BSD-2-Clause
  license_file: LICENSE.rst
  summary: SunPy core package - sunpy is a software library that provides fundamental tools for accessing, loading and interacting with solar physics data in Python
  license_family: BSD
  dev_url: https://github.com/sunpy/sunpy

extra:
  recipe-maintainers:
    - cadair
    - wtbarnes
